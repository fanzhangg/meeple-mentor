<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="大创造时代中文玩家手册：规则摘要、随堂回顾与游戏中速查。" />
    <title>大创造时代 | Meeple Mentor</title>
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="./guide.css" />
  </head>
  <body class="game-page aoi-page">
    <main class="game-shell">
      <div class="game-top-bar">
        <a class="home-link" href="../../">&lt; 所有游戏</a>
        <div id="language-menu"></div>
      </div>
      <header class="game-hero-compact">
        <img class="game-cover-compact" src="../../guide-assets/age-of-innovation/coverart.webp" alt="大创造时代游戏封面" />
        <div class="game-hero-body">
          <div class="game-title-row"><div>
            <h1>大创造时代 <small>(2023)</small></h1>
            <p class="game-tagline">改造地形，发展学术，建立自己的城市。</p>
          </div></div>
          <div class="credit-lines">
            <div class="metadata-credits">
              <p><strong>设计师：</strong>Helge Ostertag</p>
              <p><strong>插画：</strong>Alvaro Calvo Escudero、Lukas Siegmon</p>
              <p><strong>出版社：</strong>Feuerland Spiele</p>
            </div>
            <p class="mechanism-line"><strong>游戏机制：</strong>地形改造、资源管理、部族能力</p>
          </div>
        </div>
      </header>
      <div class="mobile-tabs" aria-label="玩家手册视图">
        <button class="active" id="rules-tab" type="button" data-tab="summary" aria-controls="summary-panel" aria-pressed="true">规则</button>
        <button id="ask-tab" type="button" data-tab="chat" aria-controls="chat-panel" aria-pressed="false">提问</button>
      </div>
      <section class="game-workspace">
        <article class="rule-panel active" id="summary-panel" data-panel="summary">
          <aside class="rule-menu" aria-label="规则摘要目录">
            <p class="eyebrow">规则摘要</p>
            <nav id="lesson-nav"></nav>
          </aside>
          <div class="rule-article">
            <h2>大创造时代怎么玩</h2>
            <div id="game-overview"></div>
            <div id="lesson-sections"></div>
          </div>
        </article>
        <aside class="chat-panel game-chat" id="chat-panel" data-panel="chat">
          <div class="chat-heading"><p class="eyebrow">规则问答</p><h2>边玩边问</h2></div>
          <div id="chat-log" class="chat-log" aria-live="polite"></div>
          <form id="chat-form" class="chat-form">
            <input id="question" name="question" aria-label="规则问题" placeholder="询问行动、费用、例外等规则…" autocomplete="off" />
            <button id="ask-button" type="submit">提问</button>
          </form>
        </aside>
      </section>
    </main>
    <noscript><p>请启用 JavaScript 以使用规则摘要与回顾题。</p></noscript>
    <script type="module" src="./guide.js"></script>
  </body>
</html>
