<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HUANG | Meeple Mentor</title>
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="../../guide.css" />
    <link rel="stylesheet" href="../../buttons.css" />
  </head>
  <body class="game-page">
    <main class="game-shell">
      <div class="game-top-bar">
        <a class="home-link ui-button ui-button--glass" id="home-link" href="../../"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="m14 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="home-link-label">All games</span></a>
        <div id="language-menu"></div>
      </div>

      <header class="game-hero-compact">
        <img id="game-cover" class="game-cover-compact" src="../../game-assets/huang/cover-art.png" alt="HUANG游戏封面" fetchpriority="high" />
        <div class="game-hero-body">
          <div class="game-title-row">
            <h1 id="game-title">HUANG</h1>
          </div>
        </div>
      </header>

      <div class="mobile-tabs" aria-label="HUANG page views">
        <button class="active ui-button ui-button--secondary" id="rules-tab" type="button" data-tab="summary" aria-controls="summary-panel" aria-pressed="true">Rules</button>
        <button class="ui-button ui-button--secondary" id="ask-tab" type="button" data-tab="chat" aria-controls="chat-panel" aria-pressed="false">Ask</button>
      </div>

      <section class="game-workspace">
        <article class="rule-panel active" id="summary-panel" data-panel="summary">
          <details class="rule-menu" aria-label="Rule summary sections" open>
            <summary class="eyebrow" id="rule-summary-label">Rule summary</summary>
            <nav id="lesson-nav"></nav>
          </details>
          <div class="rule-article">
            <p id="lesson-overview" class="article-lead"></p>
            <div id="lesson-sections"></div>
          </div>
        </article>

        <aside class="chat-panel game-chat" id="chat-panel" data-panel="chat">
          <div id="chat-log" class="chat-log" aria-live="polite"></div>
          <form id="chat-form" class="chat-form">
            <textarea id="question" rows="1"
              name="question"
              autocomplete="off"
              placeholder="Ask me about game rules"
            ></textarea>
            <button class="ui-button ui-button--primary ui-button--icon" id="ask-button" type="submit" title="Ask tutor">Ask</button>
          </form>
        </aside>
      </section>
    </main>

    <script src="../../app.js" type="module"></script>
    <script type="module" src="../../guide-layout.js"></script>
  </body>
</html>
